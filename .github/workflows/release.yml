name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run lint
        run: make lint

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${{ github.ref_name }}"
          BIN_NAME="pg_watcher"
          [[ "${{ matrix.goos }}" == "windows" ]] && BIN_NAME="${BIN_NAME}.exe"
          go build -ldflags "-s -w -X main.build=${VERSION}" -o "${BIN_NAME}" ./cmd/pg_watcher/main.go

      - name: Package archive
        run: |
          VERSION="${{ github.ref_name }}"
          ARCHIVE_BASE="pg_watcher_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            zip "${ARCHIVE_BASE}.zip" pg_watcher.exe
          else
            tar czf "${ARCHIVE_BASE}.tar.gz" pg_watcher
          fi

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: pg_watcher_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            *.tar.gz
            *.zip
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
